name: Daily Scrape & Deploy

# Two cron triggers, not one — confirmed in production 2026-09-02: GitHub's
# scheduler has been running the single 06:00 UTC cron hours late (once not
# firing at all before 07:18 UTC the next check), so the live site sat a
# full day stale into Norwegian morning with nothing self-correcting it.
# '30 4 * * *' is the primary run, moved earlier so even a few hours of
# GitHub-side drift still lands before Norway wakes up. '0 9 * * *' is a
# catch-up: the check-staleness job below only lets it actually scrape if
# the primary run never landed (or landed but the data is still stale for
# some other reason) — see that job for the exact rule. A third workflow,
# scrape-freshness-alert.yml, fails loudly (GitHub's own failure-email
# notification) if data is still >26h old after both of these have had
# their chance — that's the "something is actually broken, not just late"
# signal.
on:
  schedule:
    - cron: '30 4 * * *'  # primary — 04:30 UTC
    - cron: '0 9 * * *'   # catch-up — only scrapes if the primary didn't land
  workflow_dispatch:

jobs:
  # Gates the real work below to the catch-up cron only — the primary cron
  # and any manual workflow_dispatch always proceed unconditionally. Kept as
  # its own job (rather than an early-exit step inside scrape-and-deploy) so
  # a skip shows up as a clean "skipped" job in the Actions UI, not a
  # half-run one.
  check-staleness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decide whether to run
        id: check
        run: |
          if [ "${{ github.event.schedule }}" != "0 9 * * *" ]; then
            echo "Primary cron or manual run — always scraping."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_UPDATED=$(node -e "console.log(require('./data/scraped-prices.json').lastUpdated || '')")
          if [ -z "$LAST_UPDATED" ]; then
            echo "No lastUpdated found in data/scraped-prices.json — scraping to be safe."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_HOURS=$(( ( $(date -u +%s) - $(date -u -d "$LAST_UPDATED" +%s) ) / 3600 ))
          echo "Catch-up cron: last scrape is $AGE_HOURS hours old."
          if [ "$AGE_HOURS" -ge 20 ]; then
            echo "Stale (>=20h) — the primary run must have missed. Catching up now."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fresh enough — primary run already landed today. Skipping, no duplicate work."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape-and-deploy:
    needs: check-staleness
    if: needs.check-staleness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # No job-level timeout means GitHub's default of 360 minutes (6 hours) —
    # confirmed in production 2026-08-19: "Install Playwright browsers" hung
    # silently twice in one morning (no error, no log output, just stuck) with
    # nothing to catch it until someone noticed hours later. That specific
    # step now has its own 5-min timeout below, which is the real fix for
    # that hang; this job-level timeout is just a backstop against some other
    # future stuck step. Past real runs ranged 19-28 min end to end (before
    # Starframe was added as a 15th store, adding more scrape time), so 60
    # min leaves real headroom instead of risking a self-inflicted failure
    # from normal duration variance.
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # build-price-changes.js reads the last ~7 daily commits of
          # data/scraped-prices.json via `git show <sha>:...` — the default
          # shallow (depth-1) clone wouldn't have that history.
          fetch-depth: 20

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        timeout-minutes: 5

      - name: Run scrape:all
        run: pnpm scrape:all
        timeout-minutes: 90
        # scrape-all.js always exits 0 — individual failures are logged but don't block deploy
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fetch missing disc images
        run: pnpm fetch-images
        timeout-minutes: 10
        continue-on-error: true

      - name: Build price-changes.json
        run: pnpm build:price-changes
        # Must run AFTER scrape:all but BEFORE "Commit updated data" below —
        # at this point HEAD is still yesterday's committed snapshot while
        # data/scraped-prices.json on disk is today's fresh scrape, which is
        # exactly the day-over-day diff the Prisfall feature needs.

      - name: Build new-in-stores weekly files
        run: pnpm build:new-in-stores
        # "Nytt i butikk" feature — unlike build-price-changes.js this only
        # needs today's scraped-prices.json (firstSeen is already tracked
        # per-listing and never touched once set), so it doesn't depend on
        # running before/after any particular git state — kept next to
        # build:price-changes for locality, not because of a shared ordering
        # requirement.

      - name: Audit price caps
        run: pnpm audit:price-caps
        continue-on-error: true
        # Informational only — logs every scraped price outside the
        # MIN/MAX_VALID_PRICE_NOK bounds (currency bugs, accessory
        # mismatches) to data/rejected-prices.json for spot-checking.
        # Never blocks the pipeline.

      - name: Commit updated data
        run: |
          git config user.name "DiscDrop Bot"
          git config user.email "bot@discdrop.net"
          # Whole data/ dir, not an explicit file list — a scraper writing a
          # new data file that this line doesn't know about was exactly how
          # unmatched-products.json ended up perpetually uncommitted, which
          # then made `git rebase` below fail with "unstaged changes".
          git add -A -- data/
          git diff --staged --quiet || git commit -m "Daily scrape $(date +%Y-%m-%d)"
          # Retry with rebase on a non-fast-forward push — a concurrent manual
          # push to main during a long scrape run would otherwise fail this
          # step outright and skip build+deploy entirely.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push failed after 5 attempts"
              exit 1
            fi
          done

      - name: Build
        run: pnpm build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Refuses to deploy over work this checkout does not have. CI cannot see
      # unpushed local commits, so the question is asked the other way round:
      # the live site publishes the commit it was built from, and this compares
      # it against HEAD. Live commit an ancestor of HEAD means the deploy moves
      # the site forward; a commit we have never heard of means someone
      # deployed from a clone with work that never got pushed, and deploying
      # now would discard it.
      #
      # Confirmed 2026-09-05: the 08:46 cron deployed over two days of unpushed
      # catalog work — fifteen brand re-attributions and a new store — and the
      # run was green throughout. Fails open on a missing version.json, an
      # unreachable site or a dirty live build; a guard that blocks the daily
      # deploy on its own hiccups is worse than the problem.
      - name: Verify deploy provenance
        run: node scripts/check-deploy-provenance.mjs

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=discdrop --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check price alerts
        run: pnpm check-alerts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}

      # Last step in the job on purpose. It runs after the deploy, so one dead
      # store never stops the other eighteen from shipping their fresh prices,
      # and after the price alerts, so a stale store never suppresses a
      # subscriber's email. It still fails the run, which is what sends
      # GitHub's failure email.
      #
      # scrape-freshness-alert.yml watches the dataset as a whole and is blind
      # to this: with eighteen stores fresh, scraped-prices.json's lastUpdated
      # stays current no matter how long one store has been dead. Aceshop sat
      # 94 hours stale behind exactly that gap (2026-09-01..05) and was found
      # by a routine review, not by the pipeline.
      - name: Check per-store freshness
        run: node scripts/check-store-freshness.js
