# TEMPORARY — probes Frisbeebutikken's listing order from a GitHub runner.
# Deleted again on the same branch before merge.
name: Probe Frisbeebutikken sort order
on:
  push:
    branches: [claude/busy-carson-96ge0v]
    paths: ['.github/workflows/probe-frisbeebutikken.yml', 'scripts/probe/**']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - run: node scripts/probe/probe-frisbeebutikken-sort.js
